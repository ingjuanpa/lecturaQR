<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Platico - V11.1</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
body{margin:0;background:#FBEBCB;font-family:Arial}
.topbar{background:#181A2E;color:#fff;text-align:center;padding:12px;font-weight:900}
.topbar span{color:#FFA23A}
.card{max-width:720px;margin:12px auto;background:#fff;padding:16px;border-radius:10px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer}
.btn-dark{background:#181A2E;color:#FFA23A}.btn-green{background:#0A7A42;color:#fff}.btn-red{background:#B4332A;color:#fff}
#pdfview{width:100%;height:520px;border:2px solid #333;display:none;margin-top:10px}
input{width:100%;padding:9px;box-sizing:border-box;border:2px dashed #B4332A;border-radius:6px;margin-top:8px}
.opt{border:2px dashed #bbb;padding:10px;border-radius:8px;margin-top:10px;text-align:left}
#qr{display:flex;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<div class="topbar">NIT: <span>34.994.561</span> - DON PLATICO - V11.1 CORREGIDO</div>
<div class="card">
<div class="opt">
<b>1. Selecciona PDF de Odoo (como el 266-1-000569):</b>
<input type="file" id="pdfFile" accept="application/pdf">
<button id="btnAdd" class="btn-dark" style="display:none">AGREGAR NIT: 34.994.561 AL PDF</button>
<iframe id="pdfview"></iframe>
<button id="btnDown" class="btn-green" style="display:none">⬇️ DESCARGAR PDF YA CON NIT</button>
<div id="info" style="font-size:11px;margin-top:6px;text-align:left"></div>
</div>
<div class="opt" style="border-color:#B4332A">
<b>2. Sube ESE PDF descargado a Drive:</b>
<input type="text" id="driveLink" placeholder="Pega aquí el link del NUEVO PDF con NIT">
<button id="btnQR" class="btn-red">GENERAR QR NUEVO</button>
</div>
<div id="qr"></div>
<div id="status" style="font-size:11px;word-break:break-all;text-align:left;margin-top:8px"></div>
</div>
<script>
let origFile=null, modBytes=null, modUrl=null;
const view=document.getElementById('pdfview');
document.getElementById('pdfFile').addEventListener('change',e=>{
  origFile=e.target.files[0]; if(!origFile) return;
  view.style.display='block'; view.src=URL.createObjectURL(origFile);
  document.getElementById('btnAdd').style.display='block';
  document.getElementById('info').innerHTML='PDF original cargado. Pulsa AGREGAR NIT';
});
document.getElementById('btnAdd').onclick=async()=>{
  const btn=document.getElementById('btnAdd'); btn.textContent='PROCESANDO...'; btn.disabled=true;
  try{
    const buf=await origFile.arrayBuffer();
    const pdfDoc=await PDFLib.PDFDocument.load(buf);
    const font=await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const font2=await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    pdfDoc.getPages().forEach((page,i)=>{
      const {width,height}=page.getSize();
      // Fondo blanco para tapar cabecera vieja de Odoo
      page.drawRectangle({x:0,y:height-60,width:width,height:60,color:PDFLib.rgb(1,1,1)});
      // NIT grande
      page.drawText('NIT: 34.994.561 - RESTAURANTE DON PLATICO', {
        x:30, y:height-35, size:12, font:font, color:PDFLib.rgb(0.18,0.18,0.18)
      });
      page.drawText('Recibo oficial - Cartagena', {
        x:30, y:height-48, size:8, font:font2, color:PDFLib.rgb(0.4,0.4,0.4)
      });
    });
    modBytes=await pdfDoc.save();
    const blob=new Blob([modBytes],{type:'application/pdf'});
    if(modUrl) URL.revokeObjectURL(modUrl);
    modUrl=URL.createObjectURL(blob);
    view.src=modUrl;
    document.getElementById('info').innerHTML='✅ <b>¡LISTO! Ya ves el NIT arriba en la vista previa.</b><br>Si lo ves arriba, ahora descarga y súbelo a Drive.';
    document.getElementById('btnDown').style.display='block';
    btn.textContent='NIT AGREGADO ✔️';
  }catch(e){alert(e.message); btn.disabled=false; btn.textContent='AGREGAR NIT: 34.994.561 AL PDF';}
};
document.getElementById('btnDown').onclick=()=>{
  const a=document.createElement('a'); a.href=modUrl; a.download=`CON-NIT_${origFile.name}`; a.click();
  document.getElementById('info').innerHTML+='<br><br>⬇️ Descargado como CON-NIT_...pdf<br><b>IMPORTANTE:</b> Sube ESE archivo nuevo a Drive, NO el viejo.';
};
document.getElementById('btnQR').onclick=()=>{
  let link=document.getElementById('driveLink').value.trim(); if(!link){alert('Pega link');return;}
  const m=link.match(/\/d\/([^\/]+)/)||link.match(/id=([^&]+)/);
  if(m) link=`https://drive.google.com/file/d/${m[1]}/view`;
  document.getElementById('qr').innerHTML=''; new QRCode(document.getElementById('qr'),{text:link,width:300,height:300});
  document.getElementById('status').innerHTML=`✅ QR NUEVO con NIT: <a href="${link}" target="_blank">${link}</a><br><br>Escanea este QR nuevo, ahora sí verás el NIT arriba como en la vista previa.`;
};
</script>
</body>
</html>
