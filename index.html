<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Platico - V10.2 NIT</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#FBEBCB;padding:0;margin:0}
.topbar{background:#181A2E;color:white;text-align:center;padding:14px;font-weight:900;font-size:16px;position:sticky;top:0;z-index:10}
.topbar span{color:#FFA23A}
.card{max-width:520px;margin:15px auto;background:#fff;padding:22px;border-radius:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.2)}
button{background:#181A2E;color:#FFA23A;padding:14px;border:none;border-radius:8px;font-weight:900;width:100%;margin-top:12px}
input[type=text]{width:100%;padding:10px;border:2px solid #B4332A;border-radius:8px;margin-top:10px;box-sizing:border-box}
#qr{display:flex;justify-content:center;margin-top:20px}
#pdfview{width:100%;height:400px;display:none;margin-top:10px}
.opt{border:2px dashed #ccc;padding:12px;border-radius:8px;margin-top:15px;text-align:left}
</style>
</head>
<body>
<div class="topbar">NIT: <span>34.994.561</span> - RESTAURANTE DON PLATICO - V10.2</div>
<div class="card">
<h2 style="margin:0">🧾 PDF → QR</h2>
<div class="opt">
<input type="file" id="pdfFile" accept="application/pdf" style="width:100%">
<iframe id="pdfview"></iframe>
</div>
<div class="opt" style="border-color:#B4332A">
<small>Pega link de Drive del PDF:</small>
<input type="text" id="driveLink" placeholder="https://drive.google.com/...">
<button id="btnDrive" style="background:#B4332A;color:white">GENERAR QR</button>
</div>
<div id="qr"></div>
<div id="status" style="font-size:12px;word-break:break-all;text-align:left;margin-top:10px"></div>
</div>
<script>
let pdfURL=null;
document.getElementById('pdfFile').addEventListener('change',e=>{
  const f=e.target.files[0]; pdfURL=URL.createObjectURL(f);
  const v=document.getElementById('pdfview'); v.style.display='block'; v.src=pdfURL;
});
document.getElementById('btnDrive').onclick=()=>{
  let link=document.getElementById('driveLink').value.trim();
  if(!link){alert('Pega link');return;}
  const m=link.match(/\/d\/([^\/]+)/)||link.match(/id=([^&]+)/);
  if(m) link=`https://drive.google.com/file/d/${m[1]}/view`;
  document.getElementById('qr').innerHTML='';
  new QRCode(document.getElementById('qr'),{text:link,width:280,height:280});
  document.getElementById('status').innerHTML=`✅ QR listo: <a href="${link}" target="_blank">${link}</a>`;
};
</script>
</body>
</html>
