<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Platico - PDF a QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#FBEBCB;padding:15px}.card{max-width:520px;margin:auto;background:#fff;padding:22px;border-radius:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.2)} button{background:#181A2E;color:#FFA23A;padding:14px;border:none;border-radius:8px;font-weight:900;width:100%;margin-top:12px} #qr{display:flex;justify-content:center;margin-top:20px;padding:10px} #pdfview{width:100%;height:500px;border:1px solid #ccc;margin-top:15px;display:none} #status{margin-top:12px;font-size:13px;word-break:break-all}</style>
</head>
<body>
<div class="card">
<h2>🧾 Don Platico - PDF Intacto → QR</h2>
<p style="font-size:12px">El QR abrirá el PDF tal cual, con logo y todo</p>
<input type="file" id="pdfFile" accept="application/pdf" style="width:100%;padding:10px;border:2px dashed #B4332A;border-radius:8px">
<button id="uploadBtn" style="display:none">SUBIR PDF Y GENERAR QR</button>
<div id="qr"></div>
<div id="status"></div>
<iframe id="pdfview"></iframe>
<button id="printBtn" style="display:none;background:#B4332A;color:white">IMPRIMIR QR</button>
</div>
<script>
let pdfURL = null;
let fileBlob = null;

document.getElementById('pdfFile').addEventListener('change', e=>{
  fileBlob = e.target.files[0];
  if(!fileBlob) return;
  pdfURL = URL.createObjectURL(fileBlob);
  document.getElementById('pdfview').style.display='block';
  document.getElementById('pdfview').src = pdfURL;
  document.getElementById('uploadBtn').style.display='block';
  document.getElementById('status').innerHTML = `PDF cargado: ${fileBlob.name} - Vista previa abajo`;
});

document.getElementById('uploadBtn').onclick = async ()=>{
  const btn = document.getElementById('uploadBtn');
  btn.textContent = "SUBIENDO...";
  btn.disabled = true;

  try{
    // Subimos el PDF tal cual a un servidor temporal
    const form = new FormData();
    form.append('file', fileBlob);

    // usamos catbox que guarda el archivo intacto
    const res = await fetch('https://catbox.moe/user/api.php', {
      method: 'POST',
      body: form
    });
    const link = await res.text();

    if(!link.startsWith('http')){
      throw new Error('Error subiendo');
    }

    document.getElementById('qr').innerHTML='';
    new QRCode(document.getElementById('qr'),{
      text: link,
      width: 300,
      height: 300,
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('status').innerHTML = `✅ <b>QR LISTO</b><br><br>Link del PDF original:<br><a href="${link}" target="_blank">${link}</a><br><br>El cliente al escanear verá el PDF tal cual con logo y todo.`;
    document.getElementById('printBtn').style.display='block';
    btn.textContent = "QR GENERADO";

  }catch(err){
    // Si falla catbox, hacemos QR con el archivo local (solo funciona en tu PC pero te muestra la idea)
    document.getElementById('qr').innerHTML='';
    new QRCode(document.getElementById('qr'),{
      text: pdfURL,
      width: 300,
      height: 300
    });
    document.getElementById('status').innerHTML = `⚠️ No se pudo subir a internet (prueba en otra red).<br>Por ahora generé un QR de vista previa local.<br>Para que el cliente lo vea, necesitamos subirlo.<br>Error: ${err.message}`;
    btn.disabled = false;
    btn.textContent = "REINTENTAR SUBIR Y GENERAR QR";
  }
};
document.getElementById('printBtn').onclick=()=>window.print();
</script>
</body>
</html>
