<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Platico - PDF Intacto V9</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#FBEBCB;padding:15px}.card{max-width:520px;margin:auto;background:#fff;padding:22px;border-radius:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.2)} button{background:#181A2E;color:#FFA23A;padding:14px;border:none;border-radius:8px;font-weight:900;width:100%;margin-top:12px;cursor:pointer} #qr{display:flex;justify-content:center;margin-top:20px;padding:10px} #pdfview{width:100%;height:450px;border:1px solid #ccc;margin-top:15px;display:none} #status{margin-top:12px;font-size:13px;word-break:break-all;text-align:left}</style>
</head>
<body>
<div class="card">
<h2>🧾 Don Platico - PDF Intacto → QR</h2>
<p style="font-size:12px">El QR abrirá el PDF original con logo</p>
<input type="file" id="pdfFile" accept="application/pdf" style="width:100%;padding:10px;border:2px dashed #B4332A;border-radius:8px">
<button id="uploadBtn" style="display:none">SUBIR PDF ORIGINAL Y GENERAR QR</button>
<div id="qr"></div>
<div id="status"></div>
<iframe id="pdfview"></iframe>
</div>
<script>
let fileBlob=null, pdfURL=null;
document.getElementById('pdfFile').addEventListener('change', e=>{
  fileBlob=e.target.files[0]; if(!fileBlob) return;
  pdfURL=URL.createObjectURL(fileBlob);
  document.getElementById('pdfview').style.display='block';
  document.getElementById('pdfview').src=pdfURL;
  document.getElementById('uploadBtn').style.display='block';
  document.getElementById('status').innerHTML=`PDF: ${fileBlob.name} (${(fileBlob.size/1024).toFixed(1)} KB) - Listo para subir`;
});

document.getElementById('uploadBtn').onclick=async()=>{
  const btn=document.getElementById('uploadBtn'), status=document.getElementById('status');
  btn.textContent="SUBIENDO PDF ORIGINAL..."; btn.disabled=true;
  status.innerHTML="Subiendo PDF intacto a la nube...";
  try{
    const form=new FormData();
    form.append('file', fileBlob);
    // file.io SI permite CORS desde GitHub Pages
    const res=await fetch('https://file.io/?expires=1w', {method:'POST', body:form});
    const data=await res.json();
    if(!data.success) throw new Error(data.message||'Fallo subida');
    const link=data.link;
    document.getElementById('qr').innerHTML='';
    new QRCode(document.getElementById('qr'),{text:link,width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
    status.innerHTML=`✅ <b>QR LISTO - PDF INTACTO</b><br><br>Link: <a href="${link}" target="_blank">${link}</a><br><br>1. Imprime este QR<br>2. Cliente escanea<br>3. Ve el PDF tal cual con logo DON PLATICO<br><br><small>El link dura 7 días. Para permanente necesitamos Firebase.</small>`;
    btn.textContent="QR GENERADO - LISTO PARA IMPRIMIR";
  }catch(err){
    console.error(err);
    status.innerHTML=`❌ Error: ${err.message}<br><br>SOLUCIÓN RÁPIDA: GitHub Pages no deja subir a servidores gratis.<br><br><b>Para que te funcione 100% estable necesitas 2 opciones:</b><br>1. Te creo una versión con Firebase Storage (gratis y permanente)<br>2. O usas un link de Drive: subes el PDF a tu Google Drive, copias link y lo pegas para generar QR.<br><br>Dime cuál prefieres y te lo dejo listo en 2 min.`;
    btn.disabled=false; btn.textContent="REINTENTAR";
  }
};
</script>
</body>
</html>
