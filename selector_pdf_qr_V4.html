<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don Platico - Cuenta a QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#FBEBCB;padding:15px}.card{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}button{background:#181A2E;color:#FFA23A;padding:14px;border:none;border-radius:8px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}#qr{display:flex;justify-content:center;margin-top:20px}textarea{width:100%;height:140px;margin-top:12px;font-size:13px;text-align:left}</style>
</head>
<body>
<div class="card">
<h2>🧾 Cuenta PDF → QR</h2>
<p style="font-size:13px">Sube el PDF de la cuenta y genera el QR para el cliente</p>
<input type="file" id="pdfFile" accept="application/pdf" style="width:100%;padding:10px;border:2px dashed #B4332A;border-radius:8px">
<button id="genBtn" style="display:none">GENERAR QR DE ESTA CUENTA</button>
<textarea id="txtPreview" placeholder="Aquí se verá el contenido de la cuenta..." style="display:none"></textarea>
<div id="qr"></div>
<div id="status" style="margin-top:10px;font-size:13px"></div>
</div>
<script>
const pdfjsLib=window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let fullText="";

document.getElementById('pdfFile').addEventListener('change', async e=>{
  const buf=await e.target.files[0].arrayBuffer();
  const doc=await pdfjsLib.getDocument({data: buf}).promise;
  const page=await doc.getPage(1);
  const txt=await page.getTextContent();
  fullText=txt.items.map(i=>i.str).join('\n');
  document.getElementById('txtPreview').style.display='block';
  document.getElementById('txtPreview').value=fullText;
  document.getElementById('genBtn').style.display='block';
  document.getElementById('status').innerHTML=`Cuenta leída: ${fullText.length} caracteres`;
});

document.getElementById('genBtn').onclick=()=>{
  document.getElementById('qr').innerHTML='';
  new QRCode(document.getElementById('qr'),{
    text: fullText,
    width: 280,
    height: 280,
    correctLevel: QRCode.CorrectLevel.L
  });
  document.getElementById('status').innerHTML=`<b style="color:green">¡QR listo! El cliente al escanear verá:<br><br>${fullText.substring(0,200)}...</b>`;
};
</script>
</body>
</html>
